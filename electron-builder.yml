appId: com.lumen.desktop
productName: Lumen Desktop
directories:
  output: desktop-release/studio-1.3.3
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/server.mjs
  - desktop/icon.ico
  - dist/server/index.js
  - drizzle/0000_lumen.sql
  - package.json
asar: true
electronDist: node_modules/electron/dist
npmRebuild: false
win:
  icon: desktop/icon.ico
  signAndEditExecutable: true
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Lumen-Setup-${version}.${ext}
portable:
  artifactName: Lumen-Portable-${version}.${ext}
